
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Teacher Evaluation Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Install Android SDK and required packages
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # 4. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 5. Generate debug signing key
      - name: Generate debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 6. Build Android debug APK
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # 7. Upload generated APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teacher-evaluation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
